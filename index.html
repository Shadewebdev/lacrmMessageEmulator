<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webhook Simulator · la crm. Tools</title>

    <!-- Google Font (clean, professional) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ---------- Reset & Base ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f6f2ed;
            /* warm cream base */
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
            background-image: radial-gradient(circle at 20% 30%, #f0ebe5 0%, #f8f4ef 80%);
        }

        /* ---------- Main Card ---------- */
        .simulator-card {
            max-width: 640px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 40px 36px 36px;
            box-shadow: 0 12px 48px rgba(180, 160, 145, 0.12), 0 4px 16px rgba(180, 160, 145, 0.06);
            transition: box-shadow 0.25s ease;
        }

        /* ---------- Header ---------- */
        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 32px;
        }

        .card-header .icon-wrap {
            width: 48px;
            height: 48px;
            background: #e3eeea;
            /* soft sage-mint */
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-header .icon-wrap svg {
            width: 26px;
            height: 26px;
            stroke: #5d7b70;
            stroke-width: 1.8;
            fill: none;
        }

        .card-header .title-group h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #2e2e2e;
            line-height: 1.2;
        }

        .card-header .title-group .subhead {
            font-size: 14px;
            font-weight: 400;
            color: #8a7e74;
            letter-spacing: 0.2px;
            margin-top: 2px;
        }

        /* ---------- Fields ---------- */
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 28px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field label {
            font-size: 13px;
            font-weight: 600;
            color: #4a403a;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
            color: #7a6e64;
        }

        .field input,
        .field textarea {
            font-family: 'Inter', system-ui, sans-serif;
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e8e0d8;
            border-radius: 14px;
            font-size: 15px;
            color: #2e2e2e;
            background: #fbf9f7;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.02);
        }

        .field input:focus,
        .field textarea:focus {
            border-color: #b9cec4;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(181, 201, 185, 0.20);
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: #b8aea4;
            font-weight: 400;
            font-size: 14px;
        }

        .field textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        /* ---------- Button ---------- */
        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 32px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            background: #b9cec4;
            /* soft sage */
            color: #2a3d34;
            border: none;
            border-radius: 40px;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 12px rgba(181, 201, 185, 0.30);
        }

        .btn-primary:hover {
            background: #aac0b5;
            box-shadow: 0 6px 20px rgba(181, 201, 185, 0.35);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0px);
            box-shadow: 0 2px 8px rgba(181, 201, 185, 0.25);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            flex-shrink: 0;
        }

        /* ---------- Log Section ---------- */
        .log-section {
            margin-top: 4px;
        }

        .log-section .log-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .log-section .log-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: #7a6e64;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.6px;
        }

        .log-section .log-header .log-badge {
            font-size: 11px;
            font-weight: 500;
            color: #8a9b8f;
            background: #eef3ef;
            padding: 3px 12px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }

        #logs {
            background: #1f2422;
            border-radius: 16px;
            padding: 18px 20px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.6;
            height: 160px;
            overflow-y: auto;
            color: #b3d9c9;
            /* soft mint on dark */
            border: 1px solid #2e3532;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.30);
            scroll-behavior: smooth;
        }

        #logs .log-entry {
            display: block;
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        #logs .log-entry:last-child {
            border-bottom: none;
        }

        #logs .log-timestamp {
            color: #7a9a8a;
            margin-right: 10px;
            opacity: 0.7;
            font-weight: 400;
        }

        #logs .log-message {
            color: #d4e8de;
        }

        #logs .log-message .highlight {
            color: #b8d9c4;
            font-weight: 500;
        }

        #logs .empty-state {
            color: #6a7f74;
            font-style: italic;
            font-weight: 400;
            opacity: 0.7;
        }

        /* custom scroll for log */
        #logs::-webkit-scrollbar {
            width: 4px;
        }

        #logs::-webkit-scrollbar-track {
            background: #1a1f1d;
            border-radius: 8px;
        }

        #logs::-webkit-scrollbar-thumb {
            background: #4a6a5a;
            border-radius: 8px;
        }

        #logs::-webkit-scrollbar-thumb:hover {
            background: #5d7d6d;
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 520px) {
            .simulator-card {
                padding: 28px 18px 24px;
                border-radius: 20px;
            }

            .card-header .title-group h1 {
                font-size: 18px;
            }

            .card-header .icon-wrap {
                width: 40px;
                height: 40px;
            }

            .card-header .icon-wrap svg {
                width: 20px;
                height: 20px;
            }

            .btn-primary {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
            }

            .action-row {
                justify-content: stretch;
            }

            #logs {
                font-size: 12px;
                padding: 14px 16px;
                height: 130px;
            }

            .field input,
            .field textarea {
                padding: 10px 14px;
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .simulator-card {
                padding: 20px 14px 18px;
            }

            .card-header .title-group .subhead {
                font-size: 12px;
            }

            #logs {
                font-size: 11px;
                padding: 12px 14px;
                height: 110px;
            }
        }

        /* ---------- Small utility ---------- */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>

<body>

    <div class="simulator-card" role="main" aria-label="Webhook simulator">

        <!-- Header -->
        <header class="card-header">
            <div class="icon-wrap" aria-hidden="true">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    <path d="M8 10h.01" />
                    <path d="M12 10h.01" />
                    <path d="M16 10h.01" />
                </svg>
            </div>
            <div class="title-group">
                <h1>la crm. Webhook Simulator</h1>
                <p class="subhead">Dispatch mock WhatsApp payloads &amp; inspect events</p>
            </div>
        </header>

        <!-- Form Fields -->
        <div class="field-group">
            <div class="field">
                <label for="phone">Sender phone number</label>
                <input type="text" id="phone" value="1234567890" spellcheck="false" />
            </div>

            <div class="field">
                <label for="message">Incoming message body</label>
                <textarea id="message" rows="3" spellcheck="true">Hello from local simulation!</textarea>
            </div>
        </div>

        <!-- Action -->
        <div class="action-row">
            <button id="send-btn" class="btn-primary">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13" />
                    <path d="M22 2l-7 20-4-9-9-4 20-7z" />
                </svg>
                Dispatch payload
            </button>
        </div>

        <!-- Event Log -->
        <section class="log-section">
            <div class="log-header">
                <h3>Event log</h3>
                <span class="log-badge">live</span>
            </div>
            <div id="logs" role="log" aria-live="polite">
                <span class="empty-state">⏳ waiting for events …</span>
            </div>
        </section>

    </div>

    <!-- Keep original script reference (unchanged logic) -->
    <script type="module" src="/src/main.js"></script>

</body>
</html>
